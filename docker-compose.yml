services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clear_ivms
      POSTGRES_PASSWORD: clear_ivms
      POSTGRES_DB: clear_ivms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clear_ivms -d clear_ivms"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
